services:
  - type: web
    name: electrician-tiku-yotoshijo
    runtime: static
    buildCommand: node build.mjs
    staticPublishPath: dist
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
